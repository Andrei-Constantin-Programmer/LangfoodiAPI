name: .NET

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:
  schedule:
    - cron: '13 6 13 * *'

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 7.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test --no-build --verbosity detailed

  build-and-analyze:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 7.0.x

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~\sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: |
            ${{ runner.os }}-sonar

      - name: Install SonarCloud scanner
        shell: powershell
        run: |
          New-Item -Path .\.sonar\scanner -ItemType Directory -Force | Out-Null
          dotnet tool install dotnet-sonarscanner --tool-path .\.sonar\scanner --version 11.2.1

      - name: Install .NET Coverage
        run: dotnet tool install --global dotnet-coverage

      - name: Build and analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: powershell
        run: |
          .\.sonar\scanner\dotnet-sonarscanner begin `
            /k:"Andrei-Constantin-Programmer_LangfoodiAPI" `
            /o:"andrei-constantin-programmer" `
            /d:sonar.token="$env:SONAR_TOKEN" `
            /d:sonar.host.url="https://sonarcloud.io" `
            /d:sonar.cs.vscoveragexml.reportsPaths="coverage/coverage.xml" `
            /d:sonar.scanner.scanAll=false

          if ($LASTEXITCODE -ne 0) {
            Write-Error "SonarScanner begin failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

          dotnet restore

          if ($LASTEXITCODE -ne 0) {
            Write-Error "dotnet restore failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

          dotnet build --no-restore --configuration Release

          if ($LASTEXITCODE -ne 0) {
            Write-Error "dotnet build failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

          dotnet-coverage collect `
            'dotnet test --no-build --configuration Release' `
            -f xml `
            -o 'coverage/coverage.xml'

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Tests or coverage collection failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

          .\.sonar\scanner\dotnet-sonarscanner end `
            /d:sonar.token="$env:SONAR_TOKEN"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "SonarScanner end failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }
